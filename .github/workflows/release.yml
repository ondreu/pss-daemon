name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Test
        run: |
          npm run check-types
          npm test
          npm run test:integration

      - name: Build the bundle
        run: |
          npm run build
          cd dist
          sha256sum pss-daemon.cjs > pss-daemon.cjs.sha256
          cat pss-daemon.cjs.sha256

      - name: Publish the release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/pss-daemon.cjs dist/pss-daemon.cjs.sha256 \
            --title "pss-daemon $GITHUB_REF_NAME" \
            --generate-notes

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"
